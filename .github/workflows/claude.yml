name: Claude – modifications demandées
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
  actions: write
concurrency: { group: claude, cancel-in-progress: false }
jobs:
  claude:
    # seulement les demandes de Vincent (le dépôt est public)
    if: github.event.sender.login == 'vincentguiraud-hub' && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Accusé de réception
        run: gh issue comment "$ISSUE" --body "👋 Bien reçu, je m'en occupe. Je réponds ici dès que c'est prêt (en général 5 à 20 minutes)."
      - name: Préparer
        run: |
          npm install --no-audit --no-fund
          npm install -g @anthropic-ai/claude-code
          mkdir -p /tmp/demande/images
          gh issue view "$ISSUE" --comments > /tmp/demande/demande.txt
          # captures d'écran jointes à la demande
          gh api "repos/${{ github.repository }}/issues/$ISSUE" --jq .body > /tmp/demande/textes.md
          gh api "repos/${{ github.repository }}/issues/$ISSUE/comments" --jq '.[].body' >> /tmp/demande/textes.md
          i=0; for u in $(grep -oE 'https://(github\.com/user-attachments/assets|user-images\.githubusercontent\.com|private-user-images\.githubusercontent\.com)/[^ )"]+' /tmp/demande/textes.md | sort -u); do
            i=$((i+1)); curl -sL -H "Authorization: Bearer $GH_TOKEN" "$u" -o "/tmp/demande/images/capture-$i.png" || true; done
          ls -la /tmp/demande/images
      - name: Claude fait la modification
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          cat > /tmp/demande/prompt.txt <<'PROMPT'
          Tu es le développeur de G&L Diag (lis d'abord CLAUDE.md). Vincent a fait une demande depuis le logiciel.
          La demande complète (avec la conversation) est dans /tmp/demande/demande.txt.
          Ses captures d'écran éventuelles sont dans /tmp/demande/images/ : regarde-les avec l'outil Read.
          1. Comprends la demande. Si c'est une question, réponds simplement sans modifier le code.
          2. Sinon fais la modification dans le code, proprement et complètement.
          3. Lance `npm test` et corrige jusqu'à ce que tout passe. Ajoute un test si c'est utile.
          4. Termine par ta réponse à Vincent, en français, courte, sans jargon : ce que tu as changé et comment le vérifier
             dans le logiciel. Si une demande est impossible ou dangereuse (écriture non vérifiée dans un calculateur,
             contournement de fonctions payantes, etc.), explique pourquoi et propose une alternative.
          N'écris rien dans package.json pour la version et ne touche pas à .github/.
          PROMPT
          claude -p "$(cat /tmp/demande/prompt.txt)" \
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm test),Bash(npm run:*),Bash(npm install:*),Bash(node:*),Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(find:*),Bash(git diff:*),Bash(git status:*)" \
            --max-turns 80 > /tmp/demande/reponse.md || echo "Je n'ai pas pu terminer cette demande (erreur pendant le travail). Réessaie en reformulant, ou écris-moi directement dans Claude." > /tmp/demande/reponse.md
          cat /tmp/demande/reponse.md
      - name: Vérifier et publier
        run: |
          git config user.name "Claude (G&L Diag)"
          git config user.email "noreply@anthropic.com"
          if git diff --quiet; then
            gh issue comment "$ISSUE" --body-file /tmp/demande/reponse.md
            exit 0
          fi
          if ! npm test > /tmp/demande/tests.txt 2>&1; then
            { cat /tmp/demande/reponse.md; echo; echo "⚠️ Les tests automatiques échouent : je n'ai **pas** publié cette modification pour ne pas casser ton logiciel."; } > /tmp/demande/r2.md
            gh issue comment "$ISSUE" --body-file /tmp/demande/r2.md
            exit 0
          fi
          npm version patch --no-git-tag-version > /dev/null
          V=$(node -p "require('./package.json').version")
          git add -A
          git commit -q -m "$(gh issue view "$ISSUE" --json title -q .title) (#$ISSUE) – v$V

          Co-Authored-By: Claude <noreply@anthropic.com>"
          git push origin HEAD:main
          gh workflow run windows.yml --ref main
          { cat /tmp/demande/reponse.md; echo; echo "✅ Publié en **version $V**. L'installateur est en cours de fabrication (5 à 10 min) : au prochain démarrage de G&L Diag, clique sur le bandeau orange « Mise à jour prête »."; } > /tmp/demande/r2.md
          gh issue comment "$ISSUE" --body-file /tmp/demande/r2.md
